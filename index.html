    <!-- Fonts: self-hosted Archivo variable. Arial is a system font, 0 bytes. -->
    <link
      rel="preload"
      href="/fonts/archivo-var-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Enables the pre-reveal state before first paint. If JS is off or the
         user prefers reduced motion this never runs, and everything stays
         plainly visible, which is what prerendered HTML and crawlers need. -->
    <script>
      try {
        if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          document.documentElement.setAttribute("data-reveal-ready", "");
        }
      } catch (e) {}
    </script>
